version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pdf-engine:
        patterns: ['io.github.openhtmltopdf:*', 'org.apache.pdfbox:*']
    ignore:
      # Host API upgrades need an explicit Confluence compatibility decision.
      - dependency-name: com.atlassian.confluence:*
      - dependency-name: com.atlassian.sal:*
      - dependency-name: com.atlassian.beehive:*
      - dependency-name: com.atlassian.core:*
      - dependency-name: com.atlassian.user:*
      - dependency-name: com.atlassian.renderer:*
      - dependency-name: jakarta.servlet:*
      # Spring Scanner 7 is built for Java 25 (class file 69) and belongs to the next
      # Atlassian platform (Confluence 11); the plugin targets Confluence 10.2 on Java 21.
      # Patch and minor releases of 6.x still come in.
      - dependency-name: com.atlassian.plugin:atlassian-spring-scanner-*
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
